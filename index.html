<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#A8322B">
<title>赣州红色客家三日游大环线</title>
<style>
/* =========================================================
   设计画布 750 × 812
   1rem = 10 设计像素（75rem = 750）；竖向 100dvh 撑满
   ========================================================= */
:root{
  --red:#A8322B;  --red-d:#7C1F1A;  --ochre:#B4763C;  --wood:#6E4B33;  --wood-d:#4A3122;
  --paper:#F3E9D8; --paper-2:#EADCC3; --ink:#2E2A26; --ink-2:#5C5348;
  --pine:#4C6B57;  --gold:#C9A227;
  --shadow:0 1.2rem 3rem rgba(74,49,34,.22);
  --navh:12.6rem;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{font-size:min(calc(100vw / 75), 10px);}
body{margin:0;background:#241E19;color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;overflow:hidden;}
#stage{position:relative;width:100%;max-width:750px;height:100dvh;margin:0 auto;
  background:var(--paper);overflow:hidden;box-shadow:0 0 6rem rgba(0,0,0,.4);}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:90;opacity:.2;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.55'/></svg>");}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:89;
  background:radial-gradient(120% 80% at 50% 45%,rgba(0,0,0,0) 52%,rgba(60,40,25,.18) 100%);}

.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  opacity:0;transform:translateY(2rem);pointer-events:none;
  transition:opacity .34s ease,transform .34s cubic-bezier(.2,.8,.3,1);
  padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 2rem);}
.screen.on{opacity:1;transform:none;pointer-events:auto;z-index:5;}
.screen.out{opacity:0;transform:translateY(-1.4rem);}

/* ================= 首页：Day1/2/3 ================= */
#home{padding-bottom:0;overflow-y:auto;}
.home-head{text-align:center;padding:calc(5rem + env(safe-area-inset-top)) 5rem 2.4rem;}
.home-head h1{margin:0;font-size:4.9rem;line-height:1.26;letter-spacing:.08em;color:var(--red-d);
  font-family:"Songti SC","Source Han Serif SC",serif;text-shadow:0 .2rem 0 rgba(255,255,255,.7);}
.home-head .sub{margin-top:1rem;font-size:2rem;letter-spacing:.28em;color:var(--wood);}
.home-head .line{width:14rem;height:2px;margin:1.8rem auto 0;
  background:linear-gradient(90deg,transparent,rgba(110,75,51,.55),transparent);}

.days{display:flex;flex-direction:column;gap:3.2rem;padding:0 3.6rem;}
.daycard{border-radius:2rem;overflow:hidden;background:#FFFBF2;box-shadow:var(--shadow);
  border:1px solid rgba(110,75,51,.12);animation:up .5s ease both;}
.daycard{opacity:1}.daycard:nth-child(1){animation-delay:.04s}
.daycard:nth-child(2){animation-delay:.12s}
.daycard:nth-child(3){animation-delay:.2s}
@keyframes up{from{transform:translateY(2rem)}to{transform:none}}
.daycard .pic{position:relative;display:block;width:100%;height:31rem;overflow:hidden;cursor:pointer;background:#E3D3B6;}
.daycard .pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease;}
.daycard .pic:active img{transform:scale(1.03);}
.daycard .pic .tag{position:absolute;left:2rem;top:2rem;color:#fff;font-size:2rem;letter-spacing:.18em;
  padding:.6rem 1.6rem;border-radius:.9rem;background:var(--red);box-shadow:0 .6rem 1.6rem rgba(0,0,0,.3);}
.daycard .pic .enter{position:absolute;right:1.8rem;bottom:1.8rem;color:#fff;font-size:2.1rem;letter-spacing:.1em;
  padding:.8rem 2rem;border-radius:99rem;background:rgba(36,26,18,.62);backdrop-filter:blur(4px);
  border:1px solid rgba(255,255,255,.28);}
.daycard .txt{padding:2.2rem 2.6rem 2.4rem;}
.daycard .txt h3{margin:0;font-size:3.4rem;letter-spacing:.06em;color:var(--red-d);font-family:"Songti SC",serif;}
.daycard .txt .theme{margin:.6rem 0 1.6rem;font-size:2.2rem;color:var(--ink-2);letter-spacing:.04em;}
.daycard .subs{list-style:none;margin:0;padding:1.4rem 0 0;border-top:1px dashed rgba(110,75,51,.3);
  display:flex;flex-wrap:wrap;gap:.9rem 1.6rem;}
.daycard .subs li{font-size:2.1rem;color:var(--wood-d);letter-spacing:.04em;position:relative;padding-left:1.8rem;}
.daycard .subs li::before{content:"";position:absolute;left:0;top:.85em;width:.9rem;height:.9rem;border-radius:50%;
  background:var(--ochre);opacity:.8;}
.daycard[data-day="1"] .subs li::before{background:var(--red);}
.daycard[data-day="3"] .subs li::before{background:var(--pine);}
.home-note{text-align:center;font-size:1.9rem;letter-spacing:.08em;color:rgba(74,49,34,.7);
  padding:3.4rem 3rem calc(3rem + env(safe-area-inset-bottom));}

/* ================= 内页通用 ================= */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:1.4rem;
  padding:calc(3rem + env(safe-area-inset-top)) 3.2rem 1.4rem;
  background:linear-gradient(180deg,rgba(243,233,216,.97) 60%,rgba(243,233,216,0));}
.top .back{width:5.6rem;height:5.6rem;border-radius:50%;flex:0 0 auto;border:1px solid rgba(110,75,51,.28);
  background:rgba(255,250,242,.92);color:var(--wood-d);font-size:3rem;line-height:1;display:flex;
  align-items:center;justify-content:center;}
.top .ttl{font-size:2.6rem;font-weight:700;letter-spacing:.05em;}
.top .day{margin-left:auto;font-size:1.9rem;letter-spacing:.14em;color:#fff;padding:.5rem 1.4rem;border-radius:.8rem;}

.hero{position:relative;height:42rem;overflow:hidden;background:#E3D3B6;}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.hero .veil{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(36,26,18,.10) 0%,rgba(36,26,18,0) 40%,rgba(243,233,216,.99) 100%);}
.hero .cap{position:absolute;left:3.6rem;right:3.6rem;bottom:2.2rem;}
.hero .cap .no{display:inline-flex;align-items:center;justify-content:center;width:4.4rem;height:4.4rem;
  border-radius:50%;background:var(--red);color:#fff;font-size:2.2rem;box-shadow:0 .6rem 1.4rem rgba(124,31,26,.35);}
.hero .cap h2{margin:1rem 0 .4rem;font-size:4.4rem;line-height:1.2;letter-spacing:.06em;color:var(--red-d);
  font-family:"Songti SC",serif;}
.hero .cap .lead{font-size:2.3rem;color:var(--ink-2);letter-spacing:.03em;}

.body{padding:2.4rem 3.6rem 0;}
.rule{display:flex;align-items:center;gap:1.4rem;margin:0 0 2rem;}
.rule::before,.rule::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(110,75,51,.4),transparent);}
.rule span{font-size:1.9rem;letter-spacing:.26em;color:var(--wood);}
.body p{font-size:2.55rem;line-height:1.95;margin:0 0 1.8rem;color:#3B352D;text-align:justify;}
.body p::first-letter{font-size:3.1rem;color:var(--red);font-family:"Songti SC",serif;}

.strip{padding:1.4rem 0 0;}
.strip .hd{display:flex;align-items:baseline;justify-content:space-between;padding:0 3.6rem .8rem;}
.strip .hd b{font-size:2.2rem;letter-spacing:.1em;color:var(--wood-d);}
.strip .hd em{font-size:1.8rem;color:var(--ink-2);font-style:normal;}
.strip .rail{display:flex;gap:1.6rem;overflow-x:auto;padding:.6rem 3.6rem 1.4rem;scroll-snap-type:x mandatory;}
.strip .rail::-webkit-scrollbar{display:none;}
.strip .rail figure{margin:0;position:relative;flex:0 0 30rem;scroll-snap-align:start;border-radius:1.8rem;overflow:hidden;
  background:#E3D3B6;box-shadow:0 .8rem 2rem rgba(74,49,34,.16);}
.strip .rail .ph{width:100%;height:20rem;display:block;object-fit:cover;}
.strip .rail figcaption{font-size:1.8rem;color:var(--ink-2);padding:.9rem 1.2rem;background:#FFFBF2;}

/* ================= 底部大号翻页导航（全站固定） ================= */
.snav{
  position:absolute;left:0;right:0;bottom:0;z-index:60;height:calc(var(--navh) + env(safe-area-inset-bottom));
  padding:1.6rem 2.4rem calc(1.6rem + env(safe-area-inset-bottom));
  display:none;align-items:center;gap:1.4rem;
  background:linear-gradient(180deg,#8A231D,#5E1410);
  box-shadow:0 -1rem 3rem rgba(0,0,0,.28);
  border-top:1px solid rgba(255,220,170,.28);
}
.snav.on{display:flex;}
.snav .ar{
  width:8.4rem;height:8.4rem;border-radius:50%;flex:0 0 auto;border:0;padding:0;
  background:radial-gradient(circle at 35% 30%,#FFF6E2,#EAD9B8 70%,#D9C39B);
  color:var(--red-d);font-size:5rem;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 .6rem 1.6rem rgba(0,0,0,.32),inset 0 2px 0 rgba(255,255,255,.9);
  transition:transform .15s ease;
}
.snav .ar:active{transform:scale(.93);}
.snav .ar.dim{opacity:.42;}
.snav .mid{flex:1;min-width:0;text-align:center;color:#FFF3DC;}
.snav .mid b{display:block;font-size:1.9rem;letter-spacing:.28em;opacity:.85;font-weight:500;}
.snav .mid span{display:block;font-size:2.9rem;letter-spacing:.06em;margin-top:.3rem;
  font-family:"Songti SC",serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.snav .mid em{display:block;font-size:1.7rem;letter-spacing:.1em;opacity:.62;font-style:normal;margin-top:.2rem;}

/* ================= 重点页 A：叶坪科普板 ================= */
#yeping{overflow:hidden;background:#241D18;padding-bottom:0;}
.corr-stage{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#3A2B21 0%,#2A211A 46%,#1E1814 100%);}
.corr-stage .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.corr-stage .corr-veil{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(72% 62% at 50% 46%,rgba(10,6,4,.08),rgba(10,6,4,.62) 100%),
             linear-gradient(180deg,rgba(12,8,6,.55) 0%,rgba(12,8,6,.12) 34%,rgba(12,8,6,.16) 62%,rgba(12,8,6,.62) 100%);}
.corr{position:absolute;inset:0 0 var(--navh) 0;perspective:78rem;perspective-origin:50% 44%;}
.wall{position:absolute;top:14%;height:54%;width:34%;transform-style:preserve-3d;}
.wall.l{left:0;transform-origin:100% 50%;transform:rotateY(52deg);}
.wall.r{right:0;transform-origin:0% 50%;transform:rotateY(-52deg);}
.floor{position:absolute;left:0;right:0;bottom:0;height:22%;display:none;}
.ceil{position:absolute;left:0;right:0;top:0;height:22%;display:none;}
.gate{position:absolute;left:50%;top:32%;width:22%;height:30%;transform:translateX(-50%);display:none;}
.wall .plank{position:absolute;left:8%;width:84%;height:14.6%;border-radius:.7rem;cursor:pointer;
  background:linear-gradient(180deg,#C08A4E,#8C5A31 62%,#6E4426);
  border:1px solid #E4C08A;box-shadow:0 .5rem 1.2rem rgba(0,0,0,.45),inset 0 1px 0 rgba(255,235,200,.5);
  transition:transform .22s ease,filter .22s ease;display:flex;align-items:center;justify-content:space-between;
  padding:0 1rem;overflow:hidden;}
.wall .plank span{font-size:1.5rem;color:#F6E3C2;letter-spacing:.1em;opacity:.85;}
.wall .plank b{font-family:"Songti SC",serif;font-size:1.55rem;color:#FFF0D2;font-weight:600;
  max-width:64%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wall .plank.read{filter:saturate(.45) brightness(.72);}
.wall .plank.read::after{content:"✓";position:absolute;right:.6rem;top:.3rem;color:#9CE0A8;font-size:1.5rem;}
.wall .plank:active{transform:translateX(.4rem) scale(.98);filter:brightness(1.18);}
.wall .plank:nth-child(1){top:6%}.wall .plank:nth-child(2){top:23%}.wall .plank:nth-child(3){top:40%}
.wall .plank:nth-child(4){top:57%}.wall .plank:nth-child(5){top:74%}
.corr-top{position:absolute;left:0;right:0;top:calc(2.6rem + env(safe-area-inset-top));z-index:14;
  display:flex;align-items:center;gap:1.2rem;padding:0 3rem;}
.corr-top .back{width:5.2rem;height:5.2rem;border-radius:50%;border:1px solid rgba(243,225,196,.3);
  background:rgba(30,24,20,.55);color:#F3E1C4;font-size:2.8rem;display:flex;align-items:center;justify-content:center;}
.corr-top .info{font-size:2.1rem;color:#F3E1C4;letter-spacing:.05em;opacity:.9;}
.corr-top .cnt{margin-left:auto;font-size:1.9rem;color:#F3E1C4;opacity:.8;letter-spacing:.08em;}
.corr-hint{position:absolute;left:50%;bottom:calc(var(--navh) + 2.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:12;font-size:1.9rem;letter-spacing:.08em;color:#F3E1C4;background:rgba(30,24,20,.62);
  padding:.8rem 1.8rem;border-radius:99rem;border:1px solid rgba(243,225,196,.25);backdrop-filter:blur(4px);
  animation:breathe 2.6s ease-in-out infinite;white-space:nowrap;}
@keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}
.board-modal{position:absolute;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:3rem;}
.board-modal.on{display:flex;}
.board-modal .mask{position:absolute;inset:0;background:rgba(20,14,10,.74);backdrop-filter:blur(4px);}
.board-card{position:relative;width:100%;max-width:56rem;border-radius:1.8rem;overflow:hidden;
  background:linear-gradient(180deg,#EFD9AE,#D9B47F 55%,#C89C63);border:3px solid #7C5230;
  box-shadow:0 3rem 7rem rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,240,210,.5);animation:pop .3s cubic-bezier(.2,.9,.3,1);}
@keyframes pop{from{transform:scale(.9) translateY(1rem);opacity:0}to{transform:none;opacity:1}}
.board-card .bar{height:.9rem;background:linear-gradient(90deg,#A8322B,#C9A227)}
.board-card .inner{padding:3rem 3.2rem 3.2rem;min-height:36rem;display:flex;flex-direction:column;}
.board-card .no{font-size:1.9rem;letter-spacing:.22em;color:#7C1F1A;}
.board-card h3{margin:1.1rem 0 1.5rem;font-size:3.5rem;line-height:1.34;color:#4A2B1A;
  font-family:"Songti SC",serif;}
.board-card p{margin:0;font-size:2.5rem;line-height:2;color:#5B3B24;text-align:justify;}
.board-card .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:2rem;}
.board-card .nav{display:flex;gap:1.2rem;}
.board-card .nav button{width:6rem;height:6rem;border-radius:50%;border:0;background:rgba(124,31,26,.12);
  color:#7C1F1A;font-size:3rem;line-height:1;}
.board-card .dots{font-size:2rem;letter-spacing:.14em;color:#7C1F1A;opacity:.8;}
.board-card .close{position:absolute;right:1.4rem;top:1.6rem;width:4.6rem;height:4.6rem;border-radius:50%;
  border:0;background:rgba(74,43,26,.12);color:#4A2B1A;font-size:2.4rem;}

/* ================= 重点页 B：雷击树 ================= */
#leiji{overflow:hidden;padding-bottom:0;}
.tree-stage{position:absolute;inset:0 0 var(--navh) 0;overflow:hidden;background:#2A211A;}
.tree-stage .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.tree-stage.shake{animation:quake .5s cubic-bezier(.36,.07,.19,.97);}
@keyframes quake{10%,90%{transform:translate(-.3rem,.2rem)}20%,80%{transform:translate(.5rem,-.3rem)}
30%,50%,70%{transform:translate(-.8rem,.4rem)}40%,60%{transform:translate(.8rem,-.4rem)}}
.leiji-top{position:absolute;left:0;right:0;top:calc(2.6rem + env(safe-area-inset-top));z-index:20;
  display:flex;align-items:center;gap:1.2rem;padding:0 3rem;}
.leiji-top .back{width:5.2rem;height:5.2rem;border-radius:50%;border:1px solid rgba(255,255,255,.35);
  background:rgba(20,14,10,.5);color:#F3E1C4;font-size:2.8rem;display:flex;align-items:center;justify-content:center;}
.leiji-top .t{color:#FFF6E6;font-size:2.6rem;letter-spacing:.08em;text-shadow:0 2px 10px rgba(0,0,0,.65);}
.veil-top{position:absolute;left:0;right:0;top:0;height:16%;z-index:18;pointer-events:none;
  background:linear-gradient(180deg,rgba(30,22,16,.5),rgba(30,22,16,0));}
.drawer{position:absolute;left:0;right:0;bottom:0;z-index:22;border-radius:2.6rem 2.6rem 0 0;
  background:linear-gradient(180deg,rgba(243,233,216,.97),rgba(234,220,195,.99));
  box-shadow:0 -2rem 4rem rgba(0,0,0,.35);padding:1.4rem 3.2rem 2.4rem;
  transform:translateY(calc(100% - 9.4rem));transition:transform .38s cubic-bezier(.22,.9,.3,1);
  max-height:62%;display:flex;flex-direction:column;}
.drawer.open{transform:translateY(0);}
.drawer .grip{width:8rem;height:.7rem;border-radius:99rem;background:rgba(110,75,51,.3);margin:0 auto 1.2rem;}
.drawer h3{margin:0 0 1rem;font-size:2.9rem;color:var(--red-d);font-family:"Songti SC",serif;
  letter-spacing:.05em;display:flex;align-items:baseline;gap:.8rem;}
.drawer h3 em{font-size:1.8rem;color:var(--wood);font-style:normal;opacity:.85;}
.drawer .txt{overflow-y:auto;font-size:2.25rem;line-height:1.95;color:#3B352D;}
.drawer .txt p{margin:0 0 1.1rem;}
.fire-btn{position:absolute;right:3rem;bottom:calc(10rem + env(safe-area-inset-bottom));z-index:26;
  width:12.4rem;height:12.4rem;border-radius:50%;border:0;
  background:radial-gradient(circle at 35% 30%,#E4703F,#A8322B 62%,#7C1F1A);color:#FFF3DC;
  font-size:2.3rem;line-height:1.3;letter-spacing:.05em;font-weight:700;
  box-shadow:0 1.4rem 3rem rgba(124,31,26,.55),0 0 0 .6rem rgba(255,220,160,.16),inset 0 2px 0 rgba(255,255,255,.35);
  animation:pulseBtn 2.2s ease-in-out infinite;}
@keyframes pulseBtn{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.fire-btn:active{transform:scale(.94);}
.shell{position:absolute;left:0;top:0;width:3.2rem;height:3.2rem;z-index:25;pointer-events:none;
  border-radius:50% 50% 50% 20%;background:linear-gradient(180deg,#F0C86A,#B4763C 70%,#6E4426);
  box-shadow:0 0 1.6rem rgba(255,190,90,.9);will-change:transform;}
.shell::after{content:"";position:absolute;right:.6rem;top:.6rem;width:1.2rem;height:1.2rem;border-radius:50%;
  background:rgba(255,240,200,.9);}
.trail{position:absolute;width:1.2rem;height:1.2rem;border-radius:50%;background:rgba(255,180,90,.75);
  z-index:24;pointer-events:none;transition:opacity .5s ease;}
.spark{position:absolute;width:.9rem;height:.9rem;border-radius:50%;background:#FFD37A;z-index:27;
  box-shadow:0 0 1rem #FFB347;pointer-events:none;}
.boom{position:absolute;z-index:28;pointer-events:none;width:26rem;height:26rem;margin:-13rem 0 0 -13rem;
  border-radius:50%;background:radial-gradient(circle,rgba(255,240,190,.95),rgba(255,170,70,.55) 35%,rgba(255,120,60,0) 70%);
  animation:boom .55s ease-out forwards;}
@keyframes boom{from{transform:scale(.2);opacity:1}to{transform:scale(1.5);opacity:0}}
.caption{position:absolute;left:3rem;right:3rem;bottom:calc(26rem + env(safe-area-inset-bottom));z-index:29;
  background:rgba(28,21,16,.84);color:#F6E7CE;border-radius:1.6rem;padding:1.9rem 2.3rem;backdrop-filter:blur(6px);
  border:1px solid rgba(243,225,196,.2);opacity:0;transform:translateY(1.2rem);transition:.4s ease;
  font-size:2.3rem;line-height:1.8;}
.caption.on{opacity:1;transform:none;}
.replay{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18.6rem + env(safe-area-inset-bottom));z-index:30;
  border:1px solid rgba(243,225,196,.45);background:rgba(28,21,16,.8);color:#F6E7CE;border-radius:99rem;
  padding:1rem 2.6rem;font-size:2.1rem;letter-spacing:.12em;opacity:0;pointer-events:none;transition:.3s ease;}
.replay.on{opacity:1;pointer-events:auto;}

/* 图片缺失占位 */
.slot{background:
  repeating-linear-gradient(45deg,#E7D8BF,#E7D8BF 1.6rem,#E2D2B6 1.6rem,#E2D2B6 3.2rem);}
.slot::after{content:"";}
.slot.empty::after{content:attr(data-ph);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:1.9rem;letter-spacing:.12em;color:#9A7B4F;border:2px dashed rgba(154,123,79,.55);border-radius:inherit;
  text-align:center;padding:1rem;background:repeating-linear-gradient(45deg,#E7D8BF,#E7D8BF 1.6rem,#E2D2B6 1.6rem,#E2D2B6 3.2rem);}
</style>
</head>
<body>

window.__imgFail = function(el){
  el.style.visibility='hidden';
  var p=el.parentNode;
  if(p){ p.classList.add('slot','empty'); }
};
function img(src, alt, ph){
  return `<img src="${src}?v=20261123" alt="${alt||''}" onerror="__imgFail(this)">`;
}
function slot(src, ph, cls, inner){
  return `<div class="slot ${cls||''}" data-ph="${ph||'图片位置'}">
    <img class="${inner||''}" src="${src}?v=20261123" alt="" onerror="__imgFail(this)">
  </div>`;
}

/* =========================================================
   4. 构建 & 路由
   ========================================================= */
const SCREENS={};
function build(){
  view.innerHTML = homeView() + DATA.stations.map(s=>{
    if(s.kind==='yeping') return yepingView();
    if(s.kind==='tree') return leijiView();
    return stdView(s);
  }).join('');
  document.querySelectorAll('.screen').forEach(el=>SCREENS[el.id]=el);
  restoreReads();
}

let cur='home';
function go(id){
  if(!SCREENS[id]) return;
  if(id===cur && SCREENS[id].classList.contains('on')) return;
  const old=SCREENS[cur];
  if(old && old!==SCREENS[id]){ old.classList.remove('on'); old.classList.add('out'); setTimeout(()=>old.classList.remove('out'),360); }
  const t=SCREENS[id];
  t.classList.add('on'); t.scrollTop=0;
  cur=id;
  history.replaceState(null,'','#'+id);
  syncNav();
  if(id==='leiji') resetTree();
  if(id==='yeping') paintReads();
}
function syncNav(){
  const s=DATA.stations.find(x=>x.id===cur);
  if(!s){ NAV.classList.remove('on'); return; }
  NAV.classList.add('on');
  const i=DATA.stations.indexOf(s);
  const prev=DATA.stations[i-1], next=DATA.stations[i+1];
  document.getElementById('navIdx').textContent = String(s.no).padStart(2,'0')+' / '+String(DATA.stations.length).padStart(2,'0');
  document.getElementById('navName').textContent = s.name;
  document.getElementById('navDay').textContent = next
    ? ('下一站 · ' + next.name)
    : '已是最后一站 · 返回大环线';
  const bp=document.getElementById('navPrev'), bn=document.getElementById('navNext');
  bp.dataset.target = prev? prev.id : 'home';
  bn.dataset.target = next? next.id : 'home';
  bp.setAttribute('aria-label', prev? ('上一站 '+prev.name) : '返回首页');
  bn.setAttribute('aria-label', next? ('下一站 '+next.name) : '返回首页');
}
function step(dir){
  if(!DATA.stations.some(s=>s.id===cur)) return;
  const i=DATA.stations.findIndex(s=>s.id===cur);
  const t=DATA.stations[i+dir];
  go(t? t.id : 'home');
}

document.addEventListener('click', e=>{
  const nav=e.target.closest('#navPrev');
  if(nav){ step(-1); return; }
  const nav2=e.target.closest('#navNext');
  if(nav2){ step(1); return; }

  const g=e.target.closest('[data-go]');
  if(g){ go(g.dataset.go); return; }
  const p=e.target.closest('[data-board]');
  if(p){ openBoard(+p.dataset.board); return; }
  if(e.target.closest('[data-close]')){ closeBoard(); return; }
  if(e.target.closest('#fireBtn')){ fire(); return; }
  if(e.target.closest('#replayBtn')){ resetTree(); setTimeout(fire,120); return; }

  // 雷击树抽屉
  const d=document.getElementById('drawer');
  if(cur==='leiji' && d && !e.target.closest('.fire-btn') && !e.target.closest('.replay')
     && !e.target.closest('.leiji-top')){
    if(!d.classList.contains('open')) d.classList.add('open');
    else if(!e.target.closest('.txt')) d.classList.remove('open');
  }
});
window.addEventListener('hashchange',()=>{
  const id=(location.hash||'').replace('#','');
  if(SCREENS[id]) go(id);
});

let bIdx=0;
const READ_KEY='yeping-read';
let readSet=new Set();
function restoreReads(){
  try{ readSet=new Set(JSON.parse(localStorage.getItem(READ_KEY)||'[]')); }catch(e){ readSet=new Set(); }
  paintReads();
}
function saveReads(){
  try{ localStorage.setItem(READ_KEY,JSON.stringify([...readSet])); }catch(e){}
  paintReads();
}
function paintReads(){
  document.querySelectorAll('.plank').forEach(el=>el.classList.toggle('read',readSet.has(+el.dataset.board)));
  const c=document.getElementById('readCnt');
  if(c) c.textContent=`已读 ${readSet.size} / 10`;
}
function openBoard(i){
  bIdx=i;
  modalHost.innerHTML=`<div class="board-modal on">
    <div class="mask" data-close="1"></div>
    <div class="board-card">
      <div class="bar"></div>
      <button class="close" data-close="1">✕</button>
      <div class="inner">
        <div class="no" id="bNo"></div>
        <h3 id="bTitle"></h3>
        <p id="bText"></p>
        <div class="foot">
          <div class="dots" id="bDots"></div>
          <div class="nav"><button data-step="-1">‹</button><button data-step="1">›</button></div>
        </div>
      </div>
    </div>
  </div>`;
  paintBoard();
  modalHost.querySelectorAll('[data-step]').forEach(b=>{
    b.addEventListener('click',ev=>{ ev.stopPropagation(); stepBoard(+b.dataset.step); });
  });
  const card=modalHost.querySelector('.board-card');
  let sx=0,sy=0;
  card.addEventListener('touchstart',ev=>{ sx=ev.touches[0].clientX; sy=ev.touches[0].clientY; },{passive:true});
  card.addEventListener('touchend',ev=>{
    const dx=ev.changedTouches[0].clientX-sx, dy=ev.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)) stepBoard(dx>0?-1:1);
  },{passive:true});
}
function stepBoard(d){ bIdx=(bIdx+d+BOARDS.length)%BOARDS.length; paintBoard(); }
function paintBoard(){
  const b=BOARDS[bIdx];
  document.getElementById('bNo').textContent=`科普板 ${String(bIdx+1).padStart(2,'0')} / 10`;
  document.getElementById('bTitle').textContent=b.t;
  document.getElementById('bText').textContent=b.c;
  document.getElementById('bDots').textContent=`${bIdx+1} / ${BOARDS.length}`;
  readSet.add(bIdx); saveReads();
}
function closeBoard(){ modalHost.innerHTML=''; }

/* =========================================================
   6. 雷击树：炮弹动画（独立图层，不画进背景）
   ========================================================= */
let flying=false, rafId=null;
function resetTree(){
  const st=document.getElementById('treeStage'); if(!st) return;
  st.classList.remove('shake');
  st.querySelectorAll('.shell,.boom,.spark,.trail').forEach(el=>el.remove());
  const c=document.getElementById('caption'); if(c) c.classList.remove('on');
  const r=document.getElementById('replayBtn'); if(r) r.classList.remove('on');
  flying=false; if(rafId) cancelAnimationFrame(rafId);
}
function fire(){
  if(flying) return;
  const st=document.getElementById('treeStage'); if(!st) return;
  flying=true;
  const rect=st.getBoundingClientRect();
  /* 弹道：起点左下 → 顶点 → 命中点（改这三个系数即可调轨迹） */
  const p0={x:-30, y:rect.height*0.92};
  const p2={x:rect.width*0.525, y:rect.height*0.185};
  const p1={x:rect.width*0.16, y:rect.height*0.42};
  const shell=document.createElement('div'); shell.className='shell'; st.appendChild(shell);
  const dur=820, t0=performance.now();
  let lastTrail=0;
  const bez=t=>{ const u=1-t; return {
    x:u*u*p0.x+2*u*t*p1.x+t*t*p2.x,
    y:u*u*p0.y+2*u*t*p1.y+t*t*p2.y }; };
  function frame(now){
    const t=Math.min(1,(now-t0)/dur);
    const p=bez(t), pn=bez(Math.min(1,t+0.01));
    const ang=Math.atan2(pn.y-p.y,pn.x-p.x)*180/Math.PI;
    shell.style.transform=`translate(${p.x}px,${p.y}px) rotate(${ang}deg)`;
    if(now-lastTrail>38 && t<0.96){
      lastTrail=now;
      const tr=document.createElement('div'); tr.className='trail';
      tr.style.cssText=`left:${p.x}px;top:${p.y}px;opacity:.85;filter:blur(1px)`;
      st.appendChild(tr);
      setTimeout(()=>{ tr.style.opacity=0; setTimeout(()=>tr.remove(),520); },200);
    }
    if(t<1) rafId=requestAnimationFrame(frame);
    else impact(p2,st);
  }
  rafId=requestAnimationFrame(frame);
}
function impact(pt,st){
  st.classList.add('shake');
  setTimeout(()=>st.classList.remove('shake'),520);
  const boom=document.createElement('div'); boom.className='boom';
  boom.style.left=pt.x+'px'; boom.style.top=pt.y+'px';
  st.appendChild(boom); setTimeout(()=>boom.remove(),600);
  for(let i=0;i<14;i++){
    const s=document.createElement('div'); s.className='spark';
    const a=Math.random()*Math.PI*2, r=40+Math.random()*120;
    s.style.left=pt.x+'px'; s.style.top=pt.y+'px';
    st.appendChild(s);
    s.animate([
      {transform:'translate(-50%,-50%) scale(1)',opacity:1},
      {transform:`translate(${Math.cos(a)*r-50}%,${Math.sin(a)*r-50}%) scale(.2)`,opacity:0}
    ],{duration:520+Math.random()*320,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>s.remove();
  }
  const sh=st.querySelector('.shell'); if(sh){ sh.style.transition='opacity .7s ease'; setTimeout(()=>{ sh.style.opacity='0'; },260); }
  setTimeout(()=>{
    const c=document.getElementById('caption'); if(c) c.classList.add('on');
    const r=document.getElementById('replayBtn'); if(r) r.classList.add('on');
    flying=false;
  },320);
}

/* =========================================================
   7. 启动
   ========================================================= */
build();
const init=(location.hash||'').replace('#','');
if(init && init!=='home' && SCREENS[init]){
  cur='home'; SCREENS.home.classList.remove('on'); go(init);
}else{
  cur='home'; SCREENS.home.classList.add('on'); syncNav();
}
</script>
