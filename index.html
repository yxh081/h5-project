<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#A8322B">
<title>赣地文脉研学行 · 赣州红色客家三日游</title>
<style>
:root{
  --red:#A8322B;--red-d:#7C1F1A;--ochre:#B4763C;--wood:#6E4B33;--wood-d:#4A3122;
  --paper:#F3E9D8;--paper-2:#EADCC3;--ink:#2E2A26;--ink-2:#5C5348;--pine:#4C6B57;--gold:#C9A227;
  --shadow:0 1.2rem 3rem rgba(74,49,34,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:min(calc(100vw / 75), 10px)}
html,body{height:100%;margin:0}
body{background:#241E19;color:var(--ink);overflow:hidden;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
#book{position:fixed;inset:0;display:flex;justify-content:center;background:#241E19}
#stage{position:relative;width:100%;max-width:750px;height:100%;perspective:1800px;perspective-origin:50% 50%;
  overflow:hidden;background:var(--paper);box-shadow:0 0 6rem rgba(0,0,0,.5)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:99;opacity:.18;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.55'/></svg>")}

/* ---------- 书页 ---------- */
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  background:var(--paper);display:none;transform-origin:0% 50%;will-change:transform;
  backface-visibility:hidden}
.page.on{display:block}
.page.flip{display:block;transition:transform .82s cubic-bezier(.45,.05,.35,1),box-shadow .82s ease}
.page.flip::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.00) 60%,rgba(60,40,25,.28) 100%);opacity:0;transition:opacity .4s}
.page.flip.turning::after{opacity:1}
.page.shadowfall{box-shadow:-3rem 0 6rem rgba(0,0,0,.35)}

/* ---------- 封面 ---------- */
.cover{position:relative;height:100%;overflow:hidden;display:flex;flex-direction:column}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,#F9DCB0 0%,#F8E6C8 34%,#F6EFE3 62%,#F6EFE3 100%)}
.sun{position:absolute;left:12%;top:50%;width:13rem;height:13rem;border-radius:50%;
  background:radial-gradient(circle,#FFE1A8 0%,#FFD089 55%,rgba(255,208,137,0) 72%)}
.egrets{position:absolute;right:10%;top:16%;width:11rem;opacity:.72;animation:drift 9s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-1rem,-.6rem)}}
.hills{position:absolute;left:0;right:0;bottom:0;height:66%}
.hills svg{width:100%;height:100%;display:block}
.cover-text{position:relative;z-index:3;padding:calc(7rem + env(safe-area-inset-top)) 3.4rem 0;text-align:center}
.cover-badge{display:inline-block;font-size:1.7rem;letter-spacing:.22em;color:var(--red-d);
  border:1px solid rgba(178,43,39,.35);padding:.6rem 1.6rem;border-radius:99rem;background:rgba(255,255,255,.55)}
.cover h1{margin:1.6rem 0 .6rem;font-size:4.4rem;line-height:1.24;color:var(--red-d);letter-spacing:.06em;
  font-family:"Songti SC","Source Han Serif SC",serif;text-shadow:0 .2rem 0 rgba(255,255,255,.7)}
.cover h2{margin:0 0 1.2rem;font-size:1.9rem;font-weight:500;color:var(--slate);letter-spacing:.1em;color:var(--ink-2)}
.cover p{margin:0 auto;max-width:60rem;font-size:2rem;line-height:1.9;color:var(--ink-2)}
.bus-wrap{position:absolute;left:0;right:0;bottom:19%;z-index:4;display:flex;justify-content:center}
.bus{width:64%;max-width:34rem;transform:translateX(-160%)}
.bus.play{animation:busIn 1.5s cubic-bezier(.22,.9,.26,1) .2s forwards}
@keyframes busIn{from{transform:translateX(-160%)}to{transform:translateX(0)}}
.wheel{animation:spin 1.1s linear infinite;transform-origin:center;transform-box:fill-box}
@keyframes spin{to{transform:rotate(360deg)}}
.flag{transform-origin:bottom left;animation:flagWave 1.4s ease-in-out infinite}
@keyframes flagWave{0%,100%{transform:skewX(0deg)}50%{transform:skewX(-9deg)}}
.start{position:absolute;left:50%;bottom:calc(4.6rem + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:6;border:0;border-radius:99rem;padding:1.5rem 4.6rem;font-size:2.6rem;letter-spacing:.18em;
  color:#FFF6E9;background:linear-gradient(180deg,#C23A32,#9E211D);
  box-shadow:0 1.2rem 2.6rem rgba(158,33,29,.38),inset 0 1px 0 rgba(255,255,255,.35);
  animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.035)}}
.start:active{transform:translateX(-50%) scale(.97)}

/* ---------- 目录 ---------- */
.toc{padding:calc(5.4rem + env(safe-area-inset-top)) 3.4rem 4rem}
.toc h2{margin:0 0 .8rem;font-size:3.8rem;color:var(--red-d);font-family:"Songti SC",serif;letter-spacing:.06em}
.toc .sub{font-size:2rem;color:var(--ink-2);letter-spacing:.1em;margin-bottom:3rem}
.toc .cards{display:flex;flex-direction:column;gap:2.2rem}
.tcard{border-radius:2rem;overflow:hidden;background:#FFFBF2;box-shadow:var(--shadow);cursor:pointer;
  border:1px solid rgba(110,75,51,.12);opacity:0;transform:translateY(2rem)}
.toc.on .tcard{animation:up .6s cubic-bezier(.2,.8,.3,1) forwards}
.toc.on .tcard:nth-child(2){animation-delay:.12s}
.toc.on .tcard:nth-child(3){animation-delay:.24s}
@keyframes up{to{opacity:1;transform:none}}
.tcard .pic{height:16rem;overflow:hidden;background:#E3D3B6;position:relative}
.tcard .pic img{width:100%;height:100%;object-fit:cover;display:block}
.tcard .pic .tag{position:absolute;left:1.6rem;top:1.6rem;background:var(--red);color:#fff;font-size:1.8rem;
  letter-spacing:.16em;padding:.5rem 1.4rem;border-radius:.8rem}
.tcard .txt{padding:1.6rem 2rem 1.8rem;display:flex;align-items:center;gap:1rem}
.tcard h3{margin:0;font-size:2.8rem;color:var(--red-d);font-family:"Songti SC",serif}
.tcard .th{font-size:1.9rem;color:var(--ink-2);margin-top:.3rem}
.tcard .go{margin-left:auto;font-size:2.4rem;color:var(--red);opacity:.65}
.toc .hint{margin-top:3rem;text-align:center;font-size:1.9rem;color:rgba(74,49,34,.55);letter-spacing:.14em}

/* ---------- 站点 ---------- */
.st{padding:calc(4.6rem + env(safe-area-inset-top)) 0 6rem}
.st-head{padding:0 3.4rem 1.2rem;display:flex;align-items:flex-end;gap:1.2rem}
.st-head .idx{width:4.6rem;height:4.6rem;border-radius:50%;background:var(--red);color:#fff;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:2.2rem}
.st-head h2{margin:0;font-size:3.4rem;font-family:"Songti SC",serif;color:var(--red-d);letter-spacing:.04em}
.st-head .lead{font-size:1.9rem;color:var(--ink-2);margin-top:.3rem}
.hero-img{margin:0 3.4rem;border-radius:1.8rem;overflow:hidden;height:24rem;background:#E3D3B6;box-shadow:var(--shadow)}
.hero-img img{width:100%;height:100%;object-fit:cover;display:block}
.st-body{padding:2.2rem 3.4rem 0}
.st-body p{font-size:2.3rem;line-height:1.95;margin:0 0 1.5rem;color:#3B352D;text-align:justify}
.st-body p::first-letter{font-size:2.9rem;color:var(--red);font-family:"Songti SC",serif}
.gallery{display:flex;gap:1.3rem;overflow-x:auto;padding:2rem 3.4rem .8rem;scroll-snap-type:x mandatory}
.gallery::-webkit-scrollbar{display:none}
.gallery figure{margin:0;flex:0 0 25rem;scroll-snap-align:start;border-radius:1.3rem;overflow:hidden;
  background:#E3D3B6;box-shadow:0 .7rem 1.6rem rgba(74,49,34,.16);cursor:zoom-in}
.gallery img{width:100%;height:17.5rem;object-fit:cover;display:block}
.gallery figcaption{font-size:1.7rem;color:var(--ink-2);padding:.7rem 1rem;background:#FFFBF2}

/* ---------- 叶坪 3D ---------- */
.yeping{position:relative;height:100%;overflow:hidden;background:#241D18}
.yeping .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.yeping .veil{position:absolute;inset:0;background:
  radial-gradient(70% 60% at 50% 46%,rgba(10,6,4,.10),rgba(10,6,4,.66) 100%),
  linear-gradient(180deg,rgba(12,8,6,.55),rgba(12,8,6,.12) 34%,rgba(12,8,6,.18) 64%,rgba(12,8,6,.66))}
.corr{position:absolute;inset:9% 0 7%;perspective:120rem;perspective-origin:50% 46%}
.wall{position:absolute;top:12%;height:62%;width:32%;transform-style:preserve-3d}
.wall.l{left:0;transform-origin:100% 50%;transform:rotateY(38deg)}
.wall.r{right:0;transform-origin:0% 50%;transform:rotateY(-38deg)}
.plank{position:absolute;left:6%;width:88%;height:15%;border-radius:.7rem;cursor:pointer;
  background:linear-gradient(180deg,#C08A4E,#8C5A31 62%,#6E4426);border:1px solid #E4C08A;
  box-shadow:0 .5rem 1.2rem rgba(0,0,0,.45),inset 0 1px 0 rgba(255,235,200,.5);
  display:flex;align-items:center;justify-content:space-between;padding:0 1rem;overflow:hidden;
  opacity:0;transform:translateY(-2rem);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.3,1),filter .2s}
.yeping.seen .plank{opacity:1;transform:none}
.plank:nth-child(1){top:4%}.plank:nth-child(2){top:22%}.plank:nth-child(3){top:40%}
.plank:nth-child(4){top:58%}.plank:nth-child(5){top:76%}
.plank span{font-size:1.4rem;color:#F6E3C2;opacity:.85}
.plank b{font-family:"Songti SC",serif;font-size:1.5rem;color:#FFF0D2;max-width:64%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.plank.read{filter:saturate(.45) brightness(.7)}
.plank.read::after{content:"✓";position:absolute;right:.6rem;top:.2rem;color:#9CE0A8;font-size:1.4rem}
.plank.tap{animation:plankTap .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes plankTap{40%{transform:scale(1.1) translateY(-.5rem)}100%{transform:scale(1)}}
.yeping .hd{position:absolute;left:0;right:0;top:calc(3.2rem + env(safe-area-inset-top));z-index:5;
  padding:0 3.2rem;display:flex;gap:1.2rem;color:#F3E1C4;font-size:2.2rem}
.yeping .hd .c{margin-left:auto;font-size:1.9rem;opacity:.8}
.yeping .hint{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);font-size:1.8rem;color:#F3E1C4;
  background:rgba(30,24,20,.6);padding:.7rem 1.7rem;border-radius:99rem;border:1px solid rgba(243,225,196,.22);
  animation:breathe 2.6s infinite;white-space:nowrap}
@keyframes breathe{0%,100%{opacity:.65}50%{opacity:1}}

/* ---------- 雷击树 ---------- */
.leiji{position:relative;height:100%;overflow:hidden;background:#2A211A}
.leiji .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.leiji .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,22,16,.45),rgba(30,22,16,.15) 40%,rgba(30,22,16,.72))}
.leiji .hd{position:absolute;left:0;right:0;top:calc(3.2rem + env(safe-area-inset-top));z-index:5;padding:0 3.2rem;
  color:#FFF6E6;font-size:2.2rem;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.fire{position:absolute;right:3rem;bottom:9rem;z-index:6;width:12rem;height:12rem;border-radius:50%;border:0;
  background:radial-gradient(circle at 35% 30%,#E4703F,#A8322B 62%,#7C1F1A);color:#FFF3DC;font-size:2.2rem;
  line-height:1.3;font-weight:700;box-shadow:0 1.4rem 3rem rgba(124,31,26,.55);animation:pulseBtn 2.2s infinite}
@keyframes pulseBtn{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.drawer{position:absolute;left:0;right:0;bottom:0;z-index:7;border-radius:2.4rem 2.4rem 0 0;
  background:linear-gradient(180deg,rgba(243,233,216,.97),rgba(234,220,195,.99));padding:1.4rem 3.2rem 2.4rem;
  max-height:64%;display:flex;flex-direction:column;transform:translateY(calc(100% - 8rem));opacity:0;
  transition:transform .5s cubic-bezier(.22,.9,.3,1),opacity .8s ease}
.leiji.seen .drawer{opacity:1;animation:drawerIn 1s ease .25s both}
@keyframes drawerIn{from{opacity:0;transform:translateY(110%)}to{opacity:1;transform:translateY(calc(100% - 8rem))}}
.drawer.open{transform:translateY(0)!important;animation:none;opacity:1}
.drawer .grip{width:8rem;height:.7rem;border-radius:99rem;background:rgba(110,75,51,.3);margin:0 auto 1rem}
.drawer h4{margin:0 0 .8rem;font-size:2.6rem;color:var(--red-d);font-family:"Songti SC",serif;display:flex;gap:.7rem;align-items:baseline}
.drawer h4 em{font-size:1.7rem;color:var(--wood);font-style:normal}
.drawer .txt{overflow-y:auto;font-size:2.1rem;line-height:1.9;color:#3B352D}
.drawer .txt p{margin:0 0 .9rem}
.shell{position:absolute;left:0;top:0;width:3rem;height:3rem;z-index:8;pointer-events:none;border-radius:50% 50% 50% 20%;
  background:linear-gradient(180deg,#F0C86A,#B4763C 70%,#6E4426);box-shadow:0 0 1.6rem rgba(255,190,90,.9)}
.trail{position:absolute;width:1.1rem;height:1.1rem;border-radius:50%;background:rgba(255,180,90,.75);z-index:7;pointer-events:none}
.spark{position:absolute;width:.9rem;height:.9rem;border-radius:50%;background:#FFD37A;z-index:9;box-shadow:0 0 1rem #FFB347;pointer-events:none}
.boom{position:absolute;z-index:9;pointer-events:none;width:24rem;height:24rem;margin:-12rem 0 0 -12rem;border-radius:50%;
  background:radial-gradient(circle,rgba(255,240,190,.95),rgba(255,170,70,.55) 35%,rgba(255,120,60,0) 70%);
  animation:boom .55s ease-out forwards}
@keyframes boom{from{transform:scale(.2);opacity:1}to{transform:scale(1.5);opacity:0}}
.leiji .caption{position:absolute;left:3rem;right:3rem;bottom:21rem;z-index:10;background:rgba(28,21,16,.84);
  color:#F6E7CE;border-radius:1.4rem;padding:1.5rem 1.9rem;font-size:2rem;line-height:1.8;opacity:0;
  transform:translateY(1rem);transition:.4s;pointer-events:none}
.leiji .caption.on{opacity:1;transform:none}
.leiji .replay{position:absolute;left:50%;transform:translateX(-50%);bottom:15rem;z-index:10;
  border:1px solid rgba(243,225,196,.45);background:rgba(28,21,16,.8);color:#F6E7CE;border-radius:99rem;
  padding:.8rem 2.2rem;font-size:1.9rem;opacity:0;pointer-events:none;transition:.3s}
.leiji .replay.on{opacity:1;pointer-events:auto}

/* ---------- 红井滚轴 ---------- */
.reel{position:absolute;right:2.4rem;top:2.4rem;z-index:12;display:flex;flex-direction:column;align-items:center;gap:.5rem}
.reel button{width:8rem;height:8rem;border-radius:50%;border:1px solid rgba(201,162,39,.8);
  background:radial-gradient(circle at 35% 30%,#FFF3DC,#E9D3A9 70%,#D3B47D);color:var(--red-d);
  display:flex;align-items:center;justify-content:center;font-size:3rem;
  box-shadow:0 .8rem 2rem rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.9)}
.reel.playing button{animation:spinSlow 3s linear infinite}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.reel .tip{font-size:1.4rem;color:var(--red-d);background:rgba(255,250,240,.88);padding:.2rem .8rem;border-radius:99rem}
.reel .arrow{font-size:1.7rem;color:var(--red);animation:arrowBob 1.6s ease-in-out infinite}
@keyframes arrowBob{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(-.5rem);opacity:1}}

/* ---------- 答题 / 投币 / 鱼灯 ---------- */
.quiz{margin:3.4rem 3.4rem 0;padding:2.4rem;border-radius:2rem;background:#FFFBF2;box-shadow:var(--shadow)}
.quiz h4{margin:0 0 .5rem;font-size:2.5rem;color:var(--red-d);font-family:"Songti SC",serif}
.quiz .qsub{font-size:1.8rem;color:var(--ink-2);margin-bottom:1.8rem}
.qitem{margin-bottom:1.8rem}
.qitem .qt{font-size:2.1rem;line-height:1.7;margin-bottom:.9rem;color:#3B352D}
.qitem .opt{display:block;width:100%;text-align:left;font-size:2rem;padding:1.1rem 1.5rem;margin-bottom:.7rem;
  border-radius:1rem;border:1px solid rgba(110,75,51,.22);background:#FBF4E6;color:#3B352D}
.qitem .opt.right{background:#E4F0DF;border-color:#7FA36E;color:#2F4F3E}
.qitem .opt.wrong{background:#F7E0DC;border-color:#C0736A;color:#7C1F1A}
.quiz .result{font-size:2.1rem;color:var(--red-d);text-align:center;margin-top:.8rem}
.coin-game{margin:3.4rem 3.4rem 0;padding:2.2rem;border-radius:2rem;background:#FFFBF2;box-shadow:var(--shadow);text-align:center}
.coin-game h4{margin:0 0 .5rem;font-size:2.5rem;color:var(--red-d);font-family:"Songti SC",serif}
.coin-game .sub{font-size:1.8rem;color:var(--ink-2)}
.vat{position:relative;margin:1.8rem auto 0;width:100%;max-width:54rem;aspect-ratio:4/3;border-radius:1.5rem;overflow:hidden}
.vat img{width:100%;height:100%;object-fit:cover;display:block}
.coin{position:absolute;left:50%;top:-5rem;width:3rem;height:3rem;border-radius:50%;margin-left:-1.5rem;
  background:radial-gradient(circle at 35% 30%,#FFE9A8,#D9A441 65%,#A87A1F);box-shadow:0 .4rem 1rem rgba(0,0,0,.3)}
.coin.fall{animation:coinFall .85s cubic-bezier(.4,.1,.7,1) forwards}
@keyframes coinFall{92%{transform:translateY(26rem) rotate(220deg)}100%{transform:translateY(26rem) rotate(220deg) scale(.8);opacity:0}}
.ripple{position:absolute;left:50%;bottom:32%;width:2rem;height:2rem;margin-left:-1rem;border-radius:50%;
  border:2px solid rgba(255,255,255,.9);animation:ripple .7s ease-out forwards}
@keyframes ripple{to{transform:scale(6);opacity:0}}
.coin-game .num{margin-top:1.4rem;font-size:2.1rem;color:var(--wood-d)}
.coin-game .num b{color:var(--red);font-size:2.6rem;margin:0 .3rem}
.bless{margin-top:.8rem;font-size:1.9rem;color:var(--red-d);min-height:2.6rem;opacity:0;transition:.4s}
.bless.on{opacity:1}
.fish{margin:3.4rem 3.4rem 0;padding:2.2rem;border-radius:2rem;
  background:linear-gradient(135deg,#FFF7E8,#F1E2C6);border:1px dashed rgba(178,43,39,.35)}
.fish h4{margin:0 0 .5rem;font-size:2.5rem;color:var(--red-d);font-family:"Songti SC",serif}
.fish .note{font-size:1.8rem;color:#6B5A48}
.fish .steps{display:flex;gap:1rem;margin-top:1.4rem;overflow-x:auto}
.fish .step{flex:0 0 15rem;background:#FFFBF2;border-radius:1.1rem;padding:1.2rem;text-align:center;
  border:1px solid rgba(110,75,51,.14)}
.fish .step b{display:block;font-size:1.9rem;color:var(--wood-d)}
.fish .step span{font-size:1.6rem;color:var(--ink-2)}

/* ---------- 鱼灯小游戏 ---------- */
.fishgame{margin:3.4rem 3.4rem 0;padding:2.2rem;border-radius:2rem;background:#FFFBF2;box-shadow:var(--shadow)}
.fishgame h4{margin:0 0 .4rem;font-size:2.5rem;color:var(--red-d);font-family:"Songti SC",serif}
.fishgame .fg-sub{font-size:1.8rem;color:var(--ink-2);margin-bottom:1.6rem}
.fg-stage{position:relative;width:100%;aspect-ratio:1/1;max-width:44rem;margin:0 auto;border-radius:1.6rem;
  background:radial-gradient(60% 60% at 50% 45%,#FBF2DF,#EADCC3);overflow:hidden;cursor:pointer;
  border:1px solid rgba(110,75,51,.16)}
.fg-stage svg{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.fg-layer{position:absolute;inset:0;transition:opacity .45s ease}
.fg-bamboo path{stroke:#8A6A3F;stroke-width:4;fill:none;stroke-linecap:round;opacity:0;transition:opacity .35s ease}
.fg-bamboo path.on{opacity:1}
.fg-paper{opacity:0}
.fg-paper.on{opacity:1}
.fg-scales circle{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.4);
  transition:opacity .3s ease,transform .3s cubic-bezier(.2,1.6,.4,1)}
.fg-scales circle.on{opacity:1;transform:scale(1)}
.fg-glow{opacity:0;z-index:3;background:radial-gradient(circle at 50% 48%,rgba(255,214,120,.95),rgba(255,160,60,.35) 45%,rgba(255,120,40,0) 72%)}
.fg-glow.on{opacity:1;animation:fishGlow 2.4s ease-in-out infinite}
@keyframes fishGlow{0%,100%{opacity:.75}50%{opacity:1}}
.fg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;z-index:1}
.fg-bar{height:.8rem;border-radius:99rem;background:rgba(110,75,51,.14);margin:1.8rem 0 1rem;overflow:hidden}
.fg-bar i{display:block;height:100%;width:0;border-radius:99rem;
  background:linear-gradient(90deg,#C9A227,#A8322B);transition:width .35s ease}
.fg-hint{font-size:1.9rem;color:var(--wood-d);text-align:center;min-height:2.8rem}
.fg-foot{display:flex;align-items:center;justify-content:space-between;margin-top:1.4rem}
.fg-step{font-size:1.7rem;color:var(--ink-2);letter-spacing:.08em}
.fg-reset{border:1px solid rgba(110,75,51,.25);background:#FBF4E6;color:var(--wood-d);
  border-radius:99rem;padding:.7rem 1.8rem;font-size:1.7rem}
.fg-done{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;flex-direction:column;
  gap:.8rem;background:rgba(255,251,242,.86);backdrop-filter:blur(2px);text-align:center;padding:2rem}
.fg-done.on{display:flex}
.fg-done b{font-size:1.9rem;color:var(--red-d);font-family:"Songti SC",serif;line-height:1.3}
.fg-done span{font-size:1.5rem;color:var(--ink-2);line-height:1.5}
/* 鱼灯 v2：节点 / 工具条 / 素材层 */
.fg-art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;display:block}
.fg-tint{position:absolute;inset:0;z-index:2;opacity:0;transition:opacity .35s ease;pointer-events:none}
.fg-line-svg{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.fg-dots{position:absolute;inset:0;z-index:5}
.fg-dot{position:absolute;width:3.8rem;height:3.8rem;margin:-1.9rem 0 0 -1.9rem;border-radius:50%;
  border:2px solid #FFF9EC;box-shadow:0 .4rem 1rem rgba(0,0,0,.3);font-size:1.8rem;color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;transition:transform .2s}
.fg-dot.used{transform:scale(.78);opacity:.9;box-shadow:none}
.fg-dot.shake{animation:dotShake .35s}
@keyframes dotShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-.6rem)}75%{transform:translateX(.6rem)}}
.fg-tools{display:flex;gap:.9rem;margin-top:1.2rem;flex-wrap:wrap;justify-content:center}
.fg-tool{flex:0 0 auto;padding:1rem 1.5rem;border-radius:1.2rem;border:1px solid rgba(74,49,34,.22);
  font-size:1.75rem;color:#2E2A26;box-shadow:0 .3rem .8rem rgba(74,49,34,.14)}
.fg-light{background:linear-gradient(180deg,#C23A32,#9E211D)!important;color:#FFF6E9!important;
  border:0!important;padding:1.1rem 2.6rem!important;font-size:1.9rem!important}
.fg-stage{background:#FBF4E6}

.fg-art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;display:none}
.fg-parts path{fill:#F7E4C4;stroke:#9A6B34;stroke-width:1.2;cursor:pointer;transition:fill .3s}
.fg-parts path:hover{filter:brightness(1.04)}
.fg-dots{position:absolute;inset:0;z-index:5}
.fg-dot{position:absolute;width:5rem;height:5rem;margin:-2.5rem 0 0 -2.5rem;border-radius:50%;
  border:2px solid #FFF9EC;box-shadow:0 .4rem 1rem rgba(0,0,0,.3);font-size:1.9rem;color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;transition:transform .2s}
.fg-dot.used{transform:scale(.8);opacity:.9;box-shadow:none}
.fg-dot.shake{animation:dotShake .35s}
@keyframes dotShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-.6rem)}75%{transform:translateX(.6rem)}}
.fg-tools{display:flex;gap:.9rem;margin-top:1.3rem;flex-wrap:wrap}
.fg-tool{flex:0 0 auto;min-width:7.6rem;padding:1rem 1.4rem;border-radius:1.2rem;border:1px solid rgba(110,75,51,.28);
  font-size:1.75rem;color:#2E2A26;box-shadow:0 .3rem .9rem rgba(74,49,34,.12)}
.fg-done{bottom:0;top:auto;inset:auto 0 0 0;background:rgba(255,251,242,.94);padding:1.1rem 1.4rem;
  border-top:1px solid rgba(110,75,51,.18);align-items:center;gap:.2rem}
/* ---------- 遮罩 / 放大 ---------- */
.overlay{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:3rem}
.overlay.on{display:flex}
.overlay .mask{position:absolute;inset:0;background:rgba(20,14,10,.78);backdrop-filter:blur(4px);opacity:0;transition:opacity .35s}
.overlay.on .mask{opacity:1}
.sheet{position:relative;width:100%;max-width:58rem;border-radius:1.8rem;overflow:hidden;
  background:linear-gradient(180deg,#EFD9AE,#D9B47F 55%,#C89C63);border:3px solid #7C5230;
  box-shadow:0 3rem 7rem rgba(0,0,0,.6)}
.sheet .bar{height:.9rem;background:linear-gradient(90deg,#A8322B,#C9A227)}
.sheet .inner{padding:2.6rem 2.8rem 2.8rem;min-height:30rem;display:flex;flex-direction:column}
.sheet .no{font-size:1.8rem;letter-spacing:.2em;color:#7C1F1A}
.sheet h4{margin:.9rem 0 1.2rem;font-size:3.2rem;line-height:1.34;color:#4A2B1A;font-family:"Songti SC",serif}
.sheet p{margin:0;font-size:2.3rem;line-height:2;color:#5B3B24;text-align:justify}
.sheet .foot{margin-top:auto;padding-top:1.8rem;display:flex;align-items:center;justify-content:space-between}
.sheet .nav{display:flex;gap:1.1rem}
.sheet .nav button{width:5.6rem;height:5.6rem;border-radius:50%;border:0;background:rgba(124,31,26,.12);color:#7C1F1A;font-size:2.6rem}
.sheet .dots{font-size:1.8rem;letter-spacing:.14em;color:#7C1F1A;opacity:.8}
.sheet .close{position:absolute;right:1.2rem;top:1.4rem;width:4.2rem;height:4.2rem;border-radius:50%;border:0;
  background:rgba(74,43,26,.12);color:#4A2B1A;font-size:2.1rem}
.lightbox img{width:100%;max-height:68vh;object-fit:contain;display:block;border-radius:1.3rem}
.lightbox .cap{margin-top:1.2rem;text-align:center;color:#F3E9D8;font-size:2rem;letter-spacing:.08em}


/* ---------- 结语页 ---------- */
.ending{position:relative;min-height:100%;padding:calc(6rem + env(safe-area-inset-top)) 3.4rem calc(5rem + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#F7EFDF 0%,#F3E9D8 40%,#EFE2CB 100%);text-align:center;overflow:hidden}
.ending h2{margin:0;font-size:4rem;line-height:1.3;color:var(--red-d);font-family:"Songti SC",serif;letter-spacing:.06em;
  opacity:1;transform:none;transition:all .9s cubic-bezier(.2,.8,.3,1)}
.ending .esub{margin:1.2rem 0 3rem;font-size:1.85rem;color:var(--ink-2);letter-spacing:.08em;
  opacity:1;transition:all .9s ease .15s}
.ending.in h2{opacity:1;transform:none}
.ending.in .esub{opacity:1}
.ecards{display:flex;flex-direction:column;gap:1.8rem}
.ecard{background:#FFFBF2;border-radius:1.8rem;padding:2rem 2.2rem;text-align:left;
  box-shadow:0 1rem 2.4rem rgba(74,49,34,.14);border:1px solid rgba(110,75,51,.1);
  opacity:1;transform:none;transition:transform .3s ease,box-shadow .3s ease}
.ending.in .ecard{animation:ecardIn .75s cubic-bezier(.2,.8,.3,1) both}
.ending.in .ecard:nth-child(1){animation-delay:.25s}
.ending.in .ecard:nth-child(2){animation-delay:.5s}
.ending.in .ecard:nth-child(3){animation-delay:.75s}
@keyframes ecardIn{from{opacity:0;transform:translateY(-1.6rem)}to{opacity:1;transform:none}}
.ecard:active{transform:translateY(-.4rem);box-shadow:0 1.4rem 3rem rgba(74,49,34,.2)}
.ecard .eno{display:inline-block;font-size:1.6rem;letter-spacing:.16em;color:#fff;background:var(--red);
  padding:.35rem 1rem;border-radius:.6rem}
.ecard:nth-child(2) .eno{background:var(--ochre)}
.ecard:nth-child(3) .eno{background:var(--pine)}
.ecard h3{margin:.9rem 0 .6rem;font-size:2.5rem;color:var(--red-d);font-family:"Songti SC",serif}
.ecard .spots{margin:0 0 .5rem;font-size:1.85rem;color:#5B4A38;line-height:1.7}
.ecard .sum{margin:0;font-size:1.9rem;color:var(--red);line-height:1.7}
.efish{margin:3rem auto 1.6rem;width:62%;opacity:.13;filter:grayscale(.15)}
.efish img{width:100%;display:block}
.ebtns{display:flex;flex-direction:column;gap:1.1rem;margin-top:1rem}
.ebtns button{width:100%;padding:1.4rem 0;border-radius:1.4rem;font-size:2.1rem;letter-spacing:.06em;border:0;
  transition:transform .18s ease}
.ebtns button:active{transform:scale(.98)}
.ebtns .primary{background:linear-gradient(180deg,#C23A32,#9E211D);color:#FFF6E9;
  box-shadow:0 .9rem 2rem rgba(158,33,29,.32)}
.ebtns .ghost{background:#FFFBF2;color:var(--red-d);border:1px solid rgba(168,50,43,.28)}
.efoot{margin-top:2.4rem;font-size:1.7rem;color:rgba(74,49,34,.58);letter-spacing:.1em}
/* 音乐按钮 */
.music{position:fixed;right:1.8rem;top:calc(1.8rem + env(safe-area-inset-top));z-index:120;
  width:5.6rem;height:5.6rem;border-radius:50%;border:1px solid rgba(122,26,24,.25);
  background:rgba(255,250,242,.9);color:var(--red-d);font-size:2.4rem;display:flex;align-items:center;
  justify-content:center;box-shadow:0 .5rem 1.4rem rgba(0,0,0,.16);opacity:0;pointer-events:none;transition:.3s}
.music.on{opacity:1;pointer-events:auto}
.music.playing{animation:musicSpin 6s linear infinite}
@keyframes musicSpin{to{transform:rotate(360deg)}}
/* 海报弹窗 */
.poster-wrap{width:100%;max-width:52rem;text-align:center}
.poster-wrap img{width:100%;border-radius:1.2rem;box-shadow:0 2rem 5rem rgba(0,0,0,.5)}
.poster-wrap .tip{margin-top:1.2rem;color:#F3E9D8;font-size:1.8rem;letter-spacing:.06em}
.poster-wrap .ops{display:flex;gap:1rem;justify-content:center;margin-top:1.4rem}
.poster-wrap .ops a,.poster-wrap .ops button{border:0;border-radius:99rem;padding:.9rem 2.2rem;font-size:1.9rem;
  background:rgba(255,250,240,.94);color:var(--red-d);text-decoration:none}


/* 打卡寄语弹窗 */
.bless-modal{position:fixed;inset:0;z-index:320;display:none;align-items:center;justify-content:center;padding:3rem}
.bless-modal.on{display:flex}
.bless-modal .mask{position:absolute;inset:0;background:rgba(30,20,14,.55);backdrop-filter:blur(3px);opacity:0;transition:.3s}
.bless-modal.on .mask{opacity:1}
.bless-card{position:relative;width:100%;max-width:52rem;border-radius:2rem;text-align:center;
  background:linear-gradient(180deg,#FFFBF2,#F6EBD5);border:1px solid rgba(201,162,39,.5);
  box-shadow:0 2.4rem 6rem rgba(0,0,0,.4);padding:2.8rem 2.6rem 2.4rem;
  transform:translateY(4rem) scale(.96);opacity:0;transition:all .5s cubic-bezier(.2,.9,.3,1)}
.bless-modal.on .bless-card{transform:none;opacity:1}
.bless-card .seal{width:6.6rem;height:6.6rem;margin:0 auto 1.2rem;border-radius:50%;border:2px solid var(--red);
  color:var(--red);display:flex;align-items:center;justify-content:center;font-size:2rem;letter-spacing:.1em;
  font-family:"Songti SC",serif;transform:rotate(-8deg)}
.bless-card h4{margin:0 0 .9rem;font-size:2.7rem;color:var(--red-d);font-family:"Songti SC",serif;letter-spacing:.05em}
.bless-card p{margin:0 0 1.8rem;font-size:2rem;line-height:1.95;color:#4A3B2C}
.bless-card button{width:100%;padding:1.25rem 0;border-radius:1.2rem;border:0;font-size:2rem;color:#FFF6E9;
  background:linear-gradient(180deg,#C23A32,#9E211D);box-shadow:0 .8rem 1.8rem rgba(158,33,29,.3)}

/* ---------- 页码 / 提示 ---------- */
.pager{position:absolute;left:0;right:0;bottom:calc(1.6rem + env(safe-area-inset-bottom));z-index:60;
  display:flex;justify-content:center;gap:.8rem;pointer-events:none}
.pager i{width:.9rem;height:.9rem;border-radius:50%;background:rgba(122,26,24,.25)}
.pager i.on{background:var(--red);transform:scale(1.25)}
.swipe-hint{position:absolute;right:2.6rem;bottom:calc(5.2rem + env(safe-area-inset-bottom));z-index:60;
  font-size:1.7rem;color:rgba(74,49,34,.55);letter-spacing:.1em;transition:opacity .4s}
</style>
</head>
<body>
<div id="book"><div id="stage"></div></div>
<div class="overlay" id="overlay"><div class="mask" data-close></div><div id="ovBody"></div></div>
<script>
/* ===================== 数据 ===================== */
const DATA={
  days:[
    {n:1,name:'瑞金线',theme:'红色初心寻访',img:'images/day1.jpg'},
    {n:2,name:'龙南线',theme:'客家围屋探秘',img:'images/day2.jpg'},
    {n:3,name:'赣县线',theme:'古村客家寻根',img:'images/day3.jpg'}
  ],
  stations:[
    {id:'yeping',no:1,day:1,name:'叶坪景区',kind:'yeping',lead:'中华苏维埃共和国临时中央政府的诞生地'},
    {id:'zidan',no:2,day:1,name:'子弹塔',kind:'std',img:'images/zidan.jpg',lead:'一座形似子弹的纪念塔',
     paras:['红军烈士纪念塔矗立在叶坪的草坪上，塔身下宽上窄、直指天空，形状像一枚立起来的子弹，当地人因此叫它「子弹塔」。',
            '1934 年建成，是为纪念在历次战斗中牺牲的红军将士。塔前的草地上，用鹅卵石铺着一行大字——「踏着先烈血迹前进」。',
            '塔身四周嵌着石碑与浮雕，碑文记录着牺牲者的名字。抬头看，塔顶的红星与身后的青松连成一线，是叶坪最肃穆的一景。'],
     gallery:['烈士纪念塔','标语石刻','研学实拍']},
    {id:'leiji',no:3,day:1,name:'雷击树',kind:'tree',img:'images/leiji-bg.jpg',lead:'树身里嵌着一枚炮弹'},
    {id:'hongjing',no:4,day:1,name:'红井',kind:'std',img:'images/hongjing.jpg',lead:'吃水不忘挖井人',reel:true,
     paras:['1933 年，毛泽东带领红军战士和乡亲在沙洲坝挖下这口井。此前村里只能喝浑浊的塘水，井成之后，清泉终年不涸。',
            '井旁立着一块石碑，刻着「吃水不忘挖井人，时刻想念毛主席」。1950 年，当地群众为纪念挖井而刻下这行字。',
            '红井不深，井台用青石砌成，辘轳与麻绳还架在井口。伸手探一探，井水的凉意会顺着指缝上来。'],
     gallery:['井台','雕塑展示','沙洲坝旧居'],audio:'audio/hongjing.mp3'},
    {id:'shike',no:5,day:2,name:'世客围',kind:'std',img:'images/shike.jpg',lead:'世界客家民俗文化城',quiz:true,
     paras:['客家民系的形成，与中原汉人的五次大规模南迁密切相关。永嘉之乱、黄巢起义、宋室南渡……一次次迁徙把中原的礼俗、语言与建筑带到赣南。',
            '世客围以围屋形制做展馆外形，里面按「迁徙—定居—繁衍」三条线布展：客家方言、蓝衫、花灯、竹编器物依次展开。',
            '在这里最容易看懂的，是「客」字背后的生活史——从哪里来，为什么走，又怎样在异乡把日子过成自己的样子。'],
     gallery:['民俗展示','迁徙路线','客家服饰']},
    {id:'guanxi',no:6,day:2,name:'关西围',kind:'std',img:'images/guanxi.jpg',lead:'方形围屋与它的迷宫',
     paras:['关西新围建于清代嘉庆年间，平面近方形，四角设炮楼，外墙以夯土与砖石混砌，墙面密布射击孔——整座建筑就是一座可以住人的堡垒。',
            '从中央大门进去，天井、厅堂、走马廊层层递进，内廊相互贯通。第一次进去很容易绕不出来，本地人管这叫「围屋迷宫」。',
            '围屋门前的半月形水塘不只是风水，也兼作消防水源。夯土墙的横向层理、天井的通风采光，都是就地取材的智慧。'],
     gallery:['围屋正面','廊内与天井','围屋胡同']},
    {id:'bailu',no:7,day:3,name:'白鹭村',kind:'std',img:'images/bailu.jpg',lead:'千年古村，钟氏聚居',fish:true,
     paras:['白鹭古村有千年历史，钟氏宗族世代聚居。村中保存着成片的赣派建筑、宗祠与民居，马头墙层层叠叠，青石板路串起「白鹭十景」。',
            '村落依山傍水，宗祠居中——太守敬公祠、王太夫人祠是其中的代表。家规家训刻在门楣、写进族谱，宗族文化在这里不是抽象概念，而是一砖一木的秩序。',
            '名字的来历有两种说法：一说早年村前溪畔白鹭群栖，一说地形如白鹭展翅。站在村口回头看，两种说法都像。'],
     gallery:['宗祠门楼','建筑石雕','王太夫人祠']},
    {id:'kejia',no:8,day:3,name:'客家文化城',kind:'std',img:'images/kejia.jpg',lead:'牌坊、许愿缸与花灯',coin:true,
     paras:['从石牌坊进去，客家文化城把散落在赣南各地的客家记忆收进一处：许愿缸、客家博物馆、非遗展陈依次展开，一条线走完迁徙史与民俗。',
            '客家山歌、酿豆腐、客家婚俗、花灯制作——这些非遗项目至今仍活在日常里，逢年过节就能看见它们重新亮起来。',
            '围屋住人，宗祠敬祖，花灯祈福。三种建筑、三种仪式，说的其实是同一件事：把「家」安顿下来。'],
     gallery:['许愿缸','非遗展示','花灯']},
    {id:'fushou',no:9,day:3,name:'福寿沟博物馆',kind:'std',img:'images/fushou.jpg',lead:'千年不涝的地下城',
     paras:['北宋年间，赣州知州刘彝主持修建了福寿沟——两条环城地下排水道，因走向形似「福」「寿」二字而得名。',
            '福寿沟最巧的是「水窗」：利用水位差自动启闭，江水上涨时关闭防倒灌，城内积水时开启排入江中。',
            '这套系统运转了近千年，赣州古城至今仍有部分沟段在服役。博物馆里可以看到九连山的生态科普、数字化复原和古城的剖面模型。'],
     gallery:['九连山科普','数字化展示','古城剖面']}
  ]
};
const BOARDS=[
  {t:'中华苏维埃共和国临时中央政府诞生地',c:'1931 年 11 月，中华苏维埃共和国临时中央政府在叶坪宣告成立。这个位于赣南山村的国家政权，是中国共产党领导建立的第一个全国性红色政权。'},
  {t:'1931.11.7 · 第一次全国苏维埃代表大会',c:'第一次全国苏维埃代表大会在叶坪谢氏宗祠召开，来自全国各苏区的代表齐聚于此。大会通过了宪法大纲、土地法、劳动法等一系列法令。'},
  {t:'临时中央政府机构与毛泽东就任主席',c:'大会选举毛泽东为中央执行委员会主席。临时中央政府下设外交、军事、财政、土地、劳动等人民委员会，在祠堂的一间间厢房里办公。'},
  {t:'红军检阅台：阅兵与宣誓的地方',c:'叶坪广场上建有红军检阅台。红军部队在这里接受检阅，新战士在这里宣誓入伍，广场也是苏区群众集会与庆祝的场所。'},

function turn(dir){
  if(turning) return;
  const nxt=cur+dir;
  if(nxt<0||nxt>=pageEls.length) return;
  turning=true;
  const from=pageEls[cur], to=pageEls[nxt];
  if(dir>0){
    to.classList.add('on'); to.style.zIndex=1;
    from.classList.add('flip','turning'); from.style.zIndex=5;
    void from.offsetWidth;
    requestAnimationFrame(()=>{ from.style.transform='rotateY(-178deg)'; from.classList.add('shadowfall'); });
    setTimeout(()=>{
      from.classList.remove('on','flip','turning','shadowfall');
      from.style.transform=''; from.style.zIndex='';
      to.style.zIndex=''; cur=nxt; syncPager(); turning=false;
    },840);
  }else{
    to.classList.add('flip'); to.style.zIndex=5; to.style.transform='rotateY(-178deg)';
    void to.offsetWidth;
    requestAnimationFrame(()=>{ to.style.transform='rotateY(0deg)'; to.classList.add('turning'); });
    setTimeout(()=>{
      from.classList.remove('on');
      to.classList.remove('flip','turning');
      to.style.transform=''; to.style.zIndex='';
      cur=nxt; syncPager(); turning=false;
    },840);
  }
}
function syncPager(){ [...pager.children].forEach((d,k)=>d.classList.toggle('on',k===cur)); onPage(cur); }

function onPage(i){
  if(window.__bgm){
    const isEnd = pageEls[i] && pageEls[i].id==='p-end';
    if(isEnd) window.__bgm.pauseSlow(); else if(window.__bgm.isPlaying()) window.__bgm.resumeSlow();
  }
  const p=pageEls[i];
  if(p.id==='p0'){ replayBus(); }
  if(p.id==='p-yeping'){ p.querySelector('.yeping')?.classList.add('seen'); paintRead(); }
  if(p.id==='p-leiji'){ p.querySelector('.leiji')?.classList.add('seen'); }
  if(p.id==='p1'){ p.querySelector('.toc')?.classList.add('on'); }
}

  tracking = !e.target.closest('.gallery') && !e.target.closest('.steps');
},{passive:true});
stage.addEventListener('touchend', e=>{
  if(!tracking) return;
  const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
  if(Math.abs(dx)>56 && Math.abs(dx)>Math.abs(dy)*1.2){ turn(dx<0?1:-1); }
  tracking=false;
},{passive:true});

function turnTo(target){
  if(target===cur||turning) return;
  if(Math.abs(target-cur)===1){ turn(target>cur?1:-1); return; }
  turning=true;
  const from=pageEls[cur], to=pageEls[target];
  from.style.transition='opacity .26s ease'; from.style.opacity='0';
  to.classList.add('on'); to.style.opacity='0'; to.style.transition='opacity .34s ease .08s';
  requestAnimationFrame(()=>{ to.style.opacity='1'; });
  setTimeout(()=>{
    from.classList.remove('on'); from.style.cssText='';
    to.style.cssText=''; cur=target; syncPager(); turning=false;
  },460);
}

  if(p){ p.classList.add('tap'); setTimeout(()=>p.classList.remove('tap'),430); openBoard(+p.dataset.board,p); return; }
  if(e.target.closest('[data-close]')){ closeOverlay(); return; }
  const st=e.target.closest('[data-step]'); if(st){ stepBoard(+st.dataset.step); return; }
  const fig=e.target.closest('[data-zoom]');
  if(fig){ openImage(fig.dataset.zoom,fig.dataset.cap,fig.querySelector('img')); return; }
  const opt=e.target.closest('.opt'); if(opt){ answer(opt); return; }
  if(e.target.closest('#fireBtn')){ fire(); return; }
  if(e.target.closest('#replayBtn')){ resetTree(); setTimeout(fire,120); return; }
  const d=document.getElementById('drawer');
  if(d && e.target.closest('.leiji') && !e.target.closest('.fire') && !e.target.closest('.replay') && !e.target.closest('.txt')){
    d.classList.toggle('open');
  }
});
function openBoard(i,plank){
  bIdx=i; readSet.add(i); localStorage.setItem('yeping-read',JSON.stringify([...readSet])); paintRead();
  const r=plank?plank.getBoundingClientRect():null;
  ovBody.innerHTML=`<div class="sheet" id="sheet"><div class="bar"></div>
    <button class="close" data-close>✕</button>
    <div class="inner"><div class="no" id="sNo"></div><h4 id="sTitle"></h4><p id="sText"></p>
      <div class="foot"><div class="dots" id="sDots"></div><div class="nav">
        <button data-step="-1">‹</button><button data-step="1">›</button></div></div></div></div>`;
  overlay.classList.add('on'); paintSheet();
  const sh=document.getElementById('sheet');
  if(r&&sh){
    const sc=Math.min(r.width/sh.offsetWidth, r.height/sh.offsetHeight);
    sh.style.transition='none';
    sh.style.transform=`translate(${r.left+r.width/2-innerWidth/2}px,${r.top+r.height/2-innerHeight/2}px) scale(${sc})`;
    requestAnimationFrame(()=>{ sh.style.transition='transform .55s cubic-bezier(.22,.9,.28,1)'; sh.style.transform='none'; });
  }
  bindSwipe(sh);
}
function paintSheet(){
  const b=BOARDS[bIdx];
  document.getElementById('sNo').textContent=`展板 ${String(bIdx+1).padStart(2,'0')} / 10`;
  document.getElementById('sTitle').textContent=b.t;
  document.getElementById('sText').textContent=b.c;
  document.getElementById('sDots').textContent=`${bIdx+1} / ${BOARDS.length}`;
}
function stepBoard(d){
  bIdx=(bIdx+d+BOARDS.length)%BOARDS.length;
  readSet.add(bIdx); localStorage.setItem('yeping-read',JSON.stringify([...readSet])); paintRead(); paintSheet();
}
function bindSwipe(el){
  if(!el) return; let sx=0,sy=0;
  el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  el.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)) stepBoard(dx>0?-1:1);},{passive:true});
}
function openImage(src,cap,img){

const answered=new Set();
function answer(btn){

/* 雷击树 */
let flying=false, raf=null;
function resetTree(){
  const t=document.getElementById('treeStage'); if(!t) return;
  t.querySelectorAll('.shell,.boom,.spark,.trail').forEach(e=>e.remove());
  document.getElementById('caption')?.classList.remove('on');
  document.getElementById('replayBtn')?.classList.remove('on');
  flying=false; if(raf) cancelAnimationFrame(raf);
}
function fire(){
  const t=document.getElementById('treeStage'); if(!t||flying) return;
  flying=true;
  const rect=t.getBoundingClientRect();
  const p0={x:-30,y:rect.height*.92}, p2={x:rect.width*.525,y:rect.height*.185}, p1={x:rect.width*.16,y:rect.height*.42};
  const sh=document.createElement('div'); sh.className='shell'; t.appendChild(sh);
  const dur=820, t0=performance.now(); let last=0;
  const bez=k=>{const u=1-k;return{x:u*u*p0.x+2*u*k*p1.x+k*k*p2.x,y:u*u*p0.y+2*u*k*p1.y+k*k*p2.y}};
  (function frame(now){
    const k=Math.min(1,(now-t0)/dur), p=bez(k), pn=bez(Math.min(1,k+.01));
    const ang=Math.atan2(pn.y-p.y,pn.x-p.x)*180/Math.PI;
    sh.style.transform=`translate(${p.x}px,${p.y}px) rotate(${ang}deg)`;
    if(now-last>38&&k<.96){ last=now;
      const tr=document.createElement('div'); tr.className='trail'; tr.style.cssText=`left:${p.x}px;top:${p.y}px`;
      t.appendChild(tr); setTimeout(()=>tr.remove(),600); }
    if(k<1) raf=requestAnimationFrame(frame); else impact(p2);
  })(performance.now());
}
function impact(pt){
  const t=document.getElementById('treeStage');
  const bm=document.createElement('div'); bm.className='boom'; bm.style.left=pt.x+'px'; bm.style.top=pt.y+'px';
  t.appendChild(bm); setTimeout(()=>bm.remove(),600);
  for(let i=0;i<14;i++){
    const s=document.createElement('div'); s.className='spark';
    const a=Math.random()*Math.PI*2, r=40+Math.random()*110;
    s.style.left=pt.x+'px'; s.style.top=pt.y+'px'; t.appendChild(s);
    s.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},
      {transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(.2)`,opacity:0}],
      {duration:500+Math.random()*300}).onfinish=()=>s.remove();
  }
  const sh=t.querySelector('.shell'); if(sh){ sh.style.transition='opacity .7s'; setTimeout(()=>sh.style.opacity='0',260); }
  setTimeout(()=>{
    document.getElementById('caption')?.classList.add('on');
    document.getElementById('replayBtn')?.classList.add('on');
    flying=false;
  },300);
}

/* ===================== 背景音乐 ===================== */
(function bgm(){
  const audio=new Audio('audio/bgm.mp3');
  audio.loop=true; audio.volume=0;
  audio.preload='none';
  let playing=false, fadeTimer=null;

  const btn=document.createElement('button');
  btn.className='music on'; btn.innerHTML='♪'; btn.title='背景音乐';
  document.getElementById('stage').appendChild(btn);

  function fadeTo(v,dur=800){
    clearInterval(fadeTimer);
    const from=audio.volume, steps=20, dt=dur/steps;
    let i=0;
    fadeTimer=setInterval(()=>{
      i++;
      audio.volume=Math.max(0,Math.min(1, from+(v-from)*i/steps));
      if(i>=steps) clearInterval(fadeTimer);
    },dt);
  }
  btn.addEventListener('click',()=>{
    if(!playing){
      audio.play().then(()=>{ playing=true; btn.classList.add('playing'); fadeTo(.45,1200); })
        .catch(()=>{ btn.classList.remove('playing'); });
    }else{
      fadeTo(0,600); setTimeout(()=>{ audio.pause(); },650);
      playing=false; btn.classList.remove('playing');
    }
  });
  window.__bgm={ audio, isPlaying:()=>playing, fadeTo, btn,
    playStart(){ if(!playing){ audio.play().then(()=>{playing=true;btn.classList.add('playing');fadeTo(.45,1600);}).catch(()=>{}); } },
    pauseSlow(){ if(playing){ fadeTo(0,2600); setTimeout(()=>audio.pause(),2700); playing=false; btn.classList.remove('playing'); } },
    resumeSlow(){ if(audio.src&&!playing){ audio.play().then(()=>{playing=true;btn.classList.add('playing');fadeTo(.45,2600);}).catch(()=>{}); } }
  };
})();

/* ===================== 鱼灯小游戏 ===================== */
(function fishGame(){
  const stage=document.getElementById('fgStage');
  if(!stage) return;
  const art=document.getElementById('fgArt');
  const tint=document.getElementById('fgTint');
  const lines=document.getElementById('fgLines');
  const dotsBox=document.getElementById('fgDots');
  const glow=document.getElementById('fgGlow');
  const tools=document.getElementById('fgTools');
  const bar=document.getElementById('fgBar');
  const hint=document.getElementById('fgHint');
  const stepNo=document.getElementById('fgStepNo');
  const done=document.getElementById('fgDone');
  const resetBtn=document.getElementById('fgReset');

  let step=1, order=0, finished=false;
  const TIPS={
    1:'按顺序点亮的节点：黄 → 蓝 → 黑 → 绿 → 红 → 灰',
    2:'选一张棉纸，把骨架裱糊起来',
    3:'挑一种配色，给鱼灯上色',
    4:'点一下「点亮鱼灯」，让它亮起来'
  };
  const NAME={1:'扎架',2:'裱糊',3:'上色',4:'装灯'};
  const TOOLS={
    2:[{k:'p1',label:'素白棉纸',bg:'#FFFCF4'},{k:'p2',label:'米黄皮纸',bg:'#F2DDB4'},{k:'p3',label:'朱红罗纸',bg:'#E9B3A6'}],
    3:[{k:'c1',label:'朱红金鳞',bg:'#C0392B'},{k:'c2',label:'靛青描金',bg:'#3F6FA8'},{k:'c3',label:'赤霞描金',bg:'#C8641F'}]
  };

  function setArt(n){
    art.style.display='block';
    art.onerror=()=>{ art.style.display='none'; };
    art.src=FISH_ART[n]||'';
    tint.style.opacity='0';
  }
  function buildDots(){
    dotsBox.innerHTML=FISH_DOTS.map((d,i)=>
      `<button class="fg-dot" data-i="${i}" data-n="${d.name}"
        style="left:${d.x}%;top:${d.y}%;background:${d.c}"></button>`).join('');
    dotsBox.style.display='block';
  }
  function resetDots(){
    order=0; lines.innerHTML='';
    [...dotsBox.children].forEach(b=>{ b.classList.remove('used'); b.textContent=''; });
  }
  function drawLine(a,b){
    const A=FISH_DOTS[a], B=FISH_DOTS[b];
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',A.x); l.setAttribute('y1',A.y);
    l.setAttribute('x2',B.x); l.setAttribute('y2',B.y);
    lines.appendChild(l);
  }
  dotsBox.addEventListener('click',e=>{
    const b=e.target.closest('.fg-dot'); if(!b||step!==1||finished) return;
    const i=+b.dataset.i;
    if(i!==FISH_ORDER[order]){
      b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),400);
      hint.textContent='顺序不对，从「黄」重新开始';
      setTimeout(()=>{ hint.textContent=TIPS[1]; resetDots(); },700);
      return;
    }
    if(order>0) drawLine(FISH_ORDER[order-1],i);
    b.classList.add('used'); b.textContent=String(order+1); order++;
    if(order===FISH_ORDER.length) setTimeout(()=>goto(2),420);
  });

  function setTools(){
    const list=TOOLS[step]||[];
    tools.innerHTML=list.map(t=>`<button class="fg-tool" data-k="${t.k}"
      style="background:${t.bg}">${t.label}</button>`).join('') ||
      (step===4?`<button class="fg-tool fg-light" data-k="light">点亮鱼灯</button>`:'');
  }
  tools.addEventListener('click',e=>{
    const b=e.target.closest('.fg-tool'); if(!b) return;
    const k=b.dataset.k;
    if(step===2&&k.startsWith('p')){
      const c=k==='p1'?'#FFFDF6':k==='p2'?'#F1D9A8':'#E7A79B';
      tint.style.background=c; tint.style.opacity='.35';
      setTimeout(()=>goto(3),420);
    }
    if(step===3&&k.startsWith('c')){
      const c=k==='c1'?'#B02A20':k==='c2'?'#2F5F96':'#B85A1A';
      tint.style.background=c; tint.style.opacity='.28'; tint.style.mixBlendMode='multiply';
      setTimeout(()=>goto(4),420);
    }
    if(step===4&&k==='light'){
      finished=true; setArt(4); tint.style.opacity='0';
      glow.classList.add('on'); done.classList.add('on');
      bar.style.width='100%';
    }
  });

  function goto(n){
    step=n; setArt(n); setTools(); update();
    if(n===1){ buildDots(); resetDots(); }
    if(n===2||n===3||n===4){ dotsBox.style.display='none'; lines.innerHTML=''; }
  }
  function update(){
    bar.style.width=((step-1)/4*100)+'%';
    stepNo.textContent='第 '+step+' / 4 步 · '+NAME[step];
    hint.textContent=TIPS[step];
  }
  if(resetBtn) resetBtn.addEventListener('click',ev=>{
    ev.stopPropagation();
    finished=false; glow.classList.remove('on'); done.classList.remove('on'); tools.style.display='flex';
    lines.innerHTML=''; bar.style.width='0';
    goto(1);
  });
  goto(1);
})();

/* 红井音频 */
document.querySelectorAll('[data-reel]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const wrap=btn.closest('.reel'), src=btn.dataset.reel;
    let audio=document.getElementById('hjAudio');
    if(!audio){ audio=new Audio(src); audio.id='hjAudio'; }
    if(audio.getAttribute('src')!==src) audio.src=src;
    wrap.classList.add('playing');
    fetch(src,{method:'HEAD'}).then(r=>{
      if(r.ok){ audio.currentTime=0; audio.play().catch(speakHongjing); } else speakHongjing();
    }).catch(speakHongjing);
    audio.onended=()=>wrap.classList.remove('playing');
    setTimeout(()=>wrap.classList.remove('playing'),12000);
  });
});
function speakHongjing(){
  if(!('speechSynthesis' in window)) return;
  const s=DATA.stations.find(x=>x.id==='hongjing');
  const u=new SpeechSynthesisUtterance(s.paras.join('。'));
  u.lang='zh-CN'; u.rate=.95; speechSynthesis.cancel(); speechSynthesis.speak(u);
}
